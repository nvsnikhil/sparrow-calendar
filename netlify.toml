[build]
  base = "apps/experiment-06"
  publish = ".next/standalone"  # Now correctly relative to base directory
  command = "pnpm build"       # No need for cd command anymore

[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200