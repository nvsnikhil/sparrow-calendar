[build]
  base = "apps/experiment-06"  # Targets your app directory
  publish = ".next/standalone/apps/experiment-06"  # Exact output path
  command = "pnpm build"
  environment = { NODE_VERSION = "18.x" }  # Ensures Node 18+

[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200